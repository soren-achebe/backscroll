name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # MCP Registry OIDC auth + provenance attestations
  attestations: write # build provenance (gh attestation verify)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # ---- MCPB bundle + MCP Registry publish ----
      - name: Build MCPB bundle
        id: mcpb
        run: |
          set -eu
          ver=${GITHUB_REF_NAME#v}
          mkdir -p /tmp/mcpb-bins
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os=${t%-*}; arch=${t#*-}
            cp dist/backscroll_"${os}"_"${arch}"*/backscroll "/tmp/mcpb-bins/backscroll-$t"
          done
          sh mcpb/build.sh "$ver" /tmp/mcpb-bins "backscroll-$ver.mcpb"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "backscroll-$ver.mcpb" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            backscroll-${{ steps.mcpb.outputs.ver }}.mcpb

      - name: Upload MCPB to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "backscroll-${{ steps.mcpb.outputs.ver }}.mcpb"

      - name: Publish to MCP Registry
        run: |
          set -eu
          ver=${{ steps.mcpb.outputs.ver }}
          sha=${{ steps.mcpb.outputs.sha }}
          sed -e "s/__VERSION__/$ver/g" -e "s/__SHA256__/$sha/g" \
            mcpb/server.template.json > server.json
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
