name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      - name: shell integration PTY tests (bash, zsh, fish)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          pip install --quiet pexpect
          curl -sL https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh -o /tmp/bash-preexec.sh
          python3 shell/test_bash_integration.py
          python3 shell/test_zsh_fish_integration.py
      - name: cache fish 4.8.1
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/fish-4.8.1
          key: fish-4.8.1-${{ runner.os }}
      - name: E2E test against fish 4.8 native OSC 133 marks (zero-config)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x "$HOME/.cache/fish-4.8.1/fish" ]; then
            mkdir -p "$HOME/.cache/fish-4.8.1"
            curl -sL https://github.com/fish-shell/fish-shell/releases/download/4.8.1/fish-4.8.1-linux-x86_64.tar.xz \
              | tar -xJ -C "$HOME/.cache/fish-4.8.1"
          fi
          BKS_BIN="$PWD/backscroll" BKS_TEST_FISH4="$HOME/.cache/fish-4.8.1/fish" \
            python3 shell/test_fish4_native.py
      - name: E2E test against VS Code shell integration (OSC 633, zero-config)
        if: runner.os == 'Linux'
        run: |
          # Pinned to a vscode main commit; MIT-licensed script, fetched for
          # testing only (not vendored). Update SHA+checksum together.
          VSC_SHA=3460bdb15c72c1586ba5d74ce1e91df179e74215
          VSC_SUM=9d9b20908b971e89d6c07eb22ebad5fafb07ae734b037784e2bdaf7be7ec3ee7
          curl -sL -o /tmp/vsc-bash.sh "https://raw.githubusercontent.com/microsoft/vscode/$VSC_SHA/src/vs/workbench/contrib/terminal/common/scripts/shellIntegration-bash.sh"
          echo "$VSC_SUM  /tmp/vsc-bash.sh" | sha256sum -c -
          BKS_BIN="$PWD/backscroll" BKS_TEST_VSC_SH=/tmp/vsc-bash.sh \
            python3 shell/test_vscode_633.py
      - name: E2E test against kitty + wezterm shell integration (zero-config)
        if: runner.os == 'Linux'
        run: |
          # Pinned upstream integration scripts, fetched for testing only
          # (not vendored; kitty is GPLv3, wezterm is MIT). Update the
          # commit SHAs and checksums together.
          KITTY_SHA=fd7e43ab0c89760528c823f1c7c6629c34594cf8
          WEZ_SHA=76b606ec597a3c0263fa60321548637451c0a547
          curl -sL -o /tmp/kitty.bash "https://raw.githubusercontent.com/kovidgoyal/kitty/$KITTY_SHA/shell-integration/bash/kitty.bash"
          curl -sL -o /tmp/kitty-integration "https://raw.githubusercontent.com/kovidgoyal/kitty/$KITTY_SHA/shell-integration/zsh/kitty-integration"
          curl -sL -o /tmp/wezterm.sh "https://raw.githubusercontent.com/wezterm/wezterm/$WEZ_SHA/assets/shell-integration/wezterm.sh"
          sha256sum -c - <<'SUMS'
          cb5b33310bae23aa47ec342a4d843b046dfa9a804ae5a8e57a2c356c55edf5a9  /tmp/kitty.bash
          46fbd99d41e51a4b655b3e828ebf4b6a80ebed9f95e076be69bddf0a384fdf56  /tmp/kitty-integration
          8635895db5fd8828e6f7654e015ddb8564ccec21179d2aca627e0329edf9b408  /tmp/wezterm.sh
          SUMS
          BKS_BIN="$PWD/backscroll" BKS_TEST_KITTY_BASH=/tmp/kitty.bash \
            BKS_TEST_KITTY_ZSH=/tmp/kitty-integration BKS_TEST_WEZTERM_SH=/tmp/wezterm.sh \
            python3 shell/test_kitty_wezterm.py
      - name: cache bash 3.2.57
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/bash-3.2.57
          key: bash-3.2.57-${{ runner.os }}
      - name: PTY tests against bash 3.2.57 (pre-4.0 widget guard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq bison
          sh shell/build-bash32.sh "$HOME/.cache/bash-3.2.57"
          BKS_TEST_BASH="$HOME/.cache/bash-3.2.57/bin/bash" python3 shell/test_bash_integration.py
      - name: PTY tests against macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --quiet --break-system-packages pexpect \
            || python3 -m pip install --quiet pexpect
          BKS_TEST_BASH=/bin/bash python3 shell/test_bash_integration.py
