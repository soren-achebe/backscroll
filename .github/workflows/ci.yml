name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - run: go test ./...
      - run: go build .
      - name: shell integration PTY tests (bash, zsh, fish)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish fzf
          pip install --quiet pexpect
          curl -sL https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh -o /tmp/bash-preexec.sh
          python3 shell/test_bash_integration.py
          python3 shell/test_zsh_fish_integration.py
      - name: E2E test of the MCP server (stdio JSON-RPC vs real recorded session)
        if: runner.os == 'Linux'
        run: BKS_BIN="$PWD/backscroll" python3 shell/test_mcp.py
      - name: cache pwsh 7.5.4
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pwsh-7.5.4
          key: pwsh-7.5.4-${{ runner.os }}
      - name: E2E test of the PowerShell integration (init pwsh vs real pwsh)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x "$HOME/.cache/pwsh-7.5.4/pwsh" ]; then
            curl -sL -o /tmp/pwsh.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-linux-x64.tar.gz
            echo "1fd7983fe56ca9e6233f126925edb24bf6b6b33e356b69996d925c4db94e2fef  /tmp/pwsh.tar.gz" | sha256sum -c -
            mkdir -p "$HOME/.cache/pwsh-7.5.4"
            tar -xzf /tmp/pwsh.tar.gz -C "$HOME/.cache/pwsh-7.5.4"
            chmod +x "$HOME/.cache/pwsh-7.5.4/pwsh"
          fi
          BKS_TEST_BIN="$PWD/backscroll" BKS_TEST_PWSH="$HOME/.cache/pwsh-7.5.4/pwsh"             python3 shell/test_pwsh.py
      - name: cache fish 4.8.1
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/fish-4.8.1
          key: fish-4.8.1-${{ runner.os }}
      - name: E2E test against fish 4.8 native OSC 133 marks (zero-config)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x "$HOME/.cache/fish-4.8.1/fish" ]; then
            mkdir -p "$HOME/.cache/fish-4.8.1"
            curl -sL https://github.com/fish-shell/fish-shell/releases/download/4.8.1/fish-4.8.1-linux-x86_64.tar.xz \
              | tar -xJ -C "$HOME/.cache/fish-4.8.1"
          fi
          BKS_BIN="$PWD/backscroll" BKS_TEST_FISH4="$HOME/.cache/fish-4.8.1/fish" \
            python3 shell/test_fish4_native.py
      - name: cache nushell 0.114.1
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/nu-0.114.1
          key: nu-0.114.1-${{ runner.os }}
      - name: E2E test against nushell native OSC 133 marks (zero-config)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x "$HOME/.cache/nu-0.114.1/nu" ]; then
            curl -sL -o /tmp/nu.tar.gz https://github.com/nushell/nushell/releases/download/0.114.1/nu-0.114.1-x86_64-unknown-linux-musl.tar.gz
            echo "ce3a1c5a07c784098b5675224a165e73a45f0f720a8392791d7c3a5b4720255e  /tmp/nu.tar.gz" | sha256sum -c -
            tar -xzf /tmp/nu.tar.gz -C /tmp
            mkdir -p "$HOME/.cache/nu-0.114.1"
            cp /tmp/nu-0.114.1-x86_64-unknown-linux-musl/nu "$HOME/.cache/nu-0.114.1/nu"
          fi
          BKS_BIN="$PWD/backscroll" BKS_TEST_NU="$HOME/.cache/nu-0.114.1/nu" \
            python3 shell/test_nushell.py
      - name: E2E test against VS Code shell integration (OSC 633, zero-config)
        if: runner.os == 'Linux'
        run: |
          # Pinned to a vscode main commit; MIT-licensed script, fetched for
          # testing only (not vendored). Update SHA+checksum together.
          VSC_SHA=3460bdb15c72c1586ba5d74ce1e91df179e74215
          VSC_SUM=9d9b20908b971e89d6c07eb22ebad5fafb07ae734b037784e2bdaf7be7ec3ee7
          curl -sL -o /tmp/vsc-bash.sh "https://raw.githubusercontent.com/microsoft/vscode/$VSC_SHA/src/vs/workbench/contrib/terminal/common/scripts/shellIntegration-bash.sh"
          echo "$VSC_SUM  /tmp/vsc-bash.sh" | sha256sum -c -
          BKS_BIN="$PWD/backscroll" BKS_TEST_VSC_SH=/tmp/vsc-bash.sh \
            python3 shell/test_vscode_633.py
      - name: E2E test against kitty + wezterm shell integration (zero-config)
        if: runner.os == 'Linux'
        run: |
          # Pinned upstream integration scripts, fetched for testing only
          # (not vendored; kitty is GPLv3, wezterm is MIT). Update the
          # commit SHAs and checksums together.
          KITTY_SHA=fd7e43ab0c89760528c823f1c7c6629c34594cf8
          WEZ_SHA=76b606ec597a3c0263fa60321548637451c0a547
          curl -sL -o /tmp/kitty.bash "https://raw.githubusercontent.com/kovidgoyal/kitty/$KITTY_SHA/shell-integration/bash/kitty.bash"
          curl -sL -o /tmp/kitty-integration "https://raw.githubusercontent.com/kovidgoyal/kitty/$KITTY_SHA/shell-integration/zsh/kitty-integration"
          curl -sL -o /tmp/wezterm.sh "https://raw.githubusercontent.com/wezterm/wezterm/$WEZ_SHA/assets/shell-integration/wezterm.sh"
          sha256sum -c - <<'SUMS'
          cb5b33310bae23aa47ec342a4d843b046dfa9a804ae5a8e57a2c356c55edf5a9  /tmp/kitty.bash
          46fbd99d41e51a4b655b3e828ebf4b6a80ebed9f95e076be69bddf0a384fdf56  /tmp/kitty-integration
          8635895db5fd8828e6f7654e015ddb8564ccec21179d2aca627e0329edf9b408  /tmp/wezterm.sh
          SUMS
          BKS_BIN="$PWD/backscroll" BKS_TEST_KITTY_BASH=/tmp/kitty.bash \
            BKS_TEST_KITTY_ZSH=/tmp/kitty-integration BKS_TEST_WEZTERM_SH=/tmp/wezterm.sh \
            python3 shell/test_kitty_wezterm.py
      - name: E2E test against Ghostty shell integration (zero-config)
        if: runner.os == 'Linux'
        run: |
          # Pinned upstream integration scripts, fetched for testing only
          # (not vendored; ghostty's bash script is GPLv3 via kitty
          # heritage, zsh is MIT). Update the commit SHA and checksums
          # together. NOTE: the pinned ghostty.bash has an upstream bug —
          # every 133;D on the bash>=4.4 path reports exit 0 (see
          # docs/osc133.md gotcha 15); the suite pins that behavior and
          # must be updated when upstream fixes it.
          GHOSTTY_SHA=2de5e7d38e1354759211722a8687c0815d2cf02c
          curl -sL -o /tmp/ghostty.bash "https://raw.githubusercontent.com/ghostty-org/ghostty/$GHOSTTY_SHA/src/shell-integration/bash/ghostty.bash"
          curl -sL -o /tmp/ghostty-integration "https://raw.githubusercontent.com/ghostty-org/ghostty/$GHOSTTY_SHA/src/shell-integration/zsh/ghostty-integration"
          sha256sum -c - <<'SUMS'
          9c250c90d00f11c02a4245e940e5330e7e5d1eabae46d70c53b141b46b4921f0  /tmp/ghostty.bash
          1a2bcb867f06667d5d743221aea42b1d322f3ae402e1a62ba941cba3c5d17f19  /tmp/ghostty-integration
          SUMS
          BKS_BIN="$PWD/backscroll" BKS_TEST_GHOSTTY_BASH=/tmp/ghostty.bash \
            BKS_TEST_GHOSTTY_ZSH=/tmp/ghostty-integration \
            python3 shell/test_ghostty.py
      - name: E2E test against iTerm2 shell integration (zero-config)
        if: runner.os == 'Linux'
        run: |
          # Pinned upstream integration scripts, fetched for testing only
          # (not vendored; iTerm2's scripts are GPLv2). Update the commit
          # SHA and checksums together.
          ITERM2_SHA=a34730dbd2d77f5a4b64205eb83c1b483307d707
          curl -sL -o /tmp/iterm2.bash "https://raw.githubusercontent.com/gnachman/iTerm2-shell-integration/$ITERM2_SHA/shell_integration/bash"
          curl -sL -o /tmp/iterm2.zsh "https://raw.githubusercontent.com/gnachman/iTerm2-shell-integration/$ITERM2_SHA/shell_integration/zsh"
          sha256sum -c - <<'SUMS'
          c8754d9c35bc24934be7ab20735651c9a019bd2b442ebfb41d9103e62e95c5b0  /tmp/iterm2.bash
          20e90813ba1a1703cdf05df724a042d7ce69857273e933d0411fee7f2b20f09f  /tmp/iterm2.zsh
          SUMS
          BKS_BIN="$PWD/backscroll" BKS_TEST_ITERM2_BASH=/tmp/iterm2.bash \
            BKS_TEST_ITERM2_ZSH=/tmp/iterm2.zsh \
            python3 shell/test_iterm2.py
      - name: cache zellij 0.44.3
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/zellij-0.44.3
          key: zellij-0.44.3-${{ runner.os }}
      - name: E2E test of the zellij integration (floating pick keybinds)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fzf
          if [ ! -x "$HOME/.cache/zellij-0.44.3/zellij" ]; then
            mkdir -p "$HOME/.cache/zellij-0.44.3"
            curl -sL -o /tmp/zellij.tar.gz https://github.com/zellij-org/zellij/releases/download/v0.44.3/zellij-x86_64-unknown-linux-musl.tar.gz
            echo "0f7c346788627f506c0a28296517768633cff24fc822a739f8264b640ecad751  /tmp/zellij.tar.gz" | sha256sum -c -
            tar xzf /tmp/zellij.tar.gz -C "$HOME/.cache/zellij-0.44.3"
          fi
          BKS_BIN="$PWD/backscroll" BKS_TEST_ZELLIJ="$HOME/.cache/zellij-0.44.3/zellij" \
            python3 shell/test_zellij.py
      - name: E2E test of the GNU screen integration (C-a B/F picker binds)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq screen fzf
          BKS_BIN="$PWD/backscroll" python3 shell/test_screen.py
      - name: cache bash 3.2.57
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/bash-3.2.57
          key: bash-3.2.57-${{ runner.os }}
      - name: PTY tests against bash 3.2.57 (pre-4.0 widget guard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq bison
          sh shell/build-bash32.sh "$HOME/.cache/bash-3.2.57"
          BKS_TEST_BASH="$HOME/.cache/bash-3.2.57/bin/bash" python3 shell/test_bash_integration.py
      - name: PTY tests against macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --quiet --break-system-packages pexpect \
            || python3 -m pip install --quiet pexpect
          BKS_TEST_BASH=/bin/bash python3 shell/test_bash_integration.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - run: go vet ./...
      - name: unit tests + ConPTY E2E (real pwsh under backscroll run)
        run: go test ./... -count=1 -timeout 15m

  compat-matrix:
    # backscroll alongside atuin / starship / zoxide / direnv / oh-my-zsh /
    # powerlevel10k (incl. instant prompt) in bash, zsh and fish — real
    # binaries, pinned versions. See shell/test_compat_matrix.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - run: go build .
      - name: cache pinned third-party tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/bks-compat-tools
          key: compat-atuin18.17.1-starship1.26.0-zoxide0.10.0-direnv2.37.1-omz-b37dd49-p10k-9253fb1
      - name: fetch pinned tools
        run: |
          set -euo pipefail
          T="$HOME/.cache/bks-compat-tools"
          mkdir -p "$T/bin" && cd "$T"
          if [ ! -x bin/atuin ]; then
            curl -sLO https://github.com/atuinsh/atuin/releases/download/v18.17.1/atuin-x86_64-unknown-linux-musl.tar.gz
            echo "5772df4121174a9f0b71c17260727794fde22a71b5a3ee5ac07b227eebcbfa9a  atuin-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
            tar xzf atuin-x86_64-unknown-linux-musl.tar.gz
            mv atuin-x86_64-unknown-linux-musl/atuin bin/
          fi
          if [ ! -x bin/starship ]; then
            curl -sLO https://github.com/starship/starship/releases/download/v1.26.0/starship-x86_64-unknown-linux-musl.tar.gz
            echo "b7c232b0e8249d8e55a40beb79c5c43a7d370f3f9408bd215deb0170daeaadf3  starship-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
            tar xzf starship-x86_64-unknown-linux-musl.tar.gz -C bin starship
          fi
          if [ ! -x bin/zoxide ]; then
            curl -sLO https://github.com/ajeetdsouza/zoxide/releases/download/v0.10.0/zoxide-0.10.0-x86_64-unknown-linux-musl.tar.gz
            echo "2d93385b99f3e82cf2701609a1bffcad863fbeb75aa3fe7eb6be4d29be68b1ae  zoxide-0.10.0-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
            tar xzf zoxide-0.10.0-x86_64-unknown-linux-musl.tar.gz -C bin zoxide
          fi
          if [ ! -x bin/direnv ]; then
            curl -sL -o bin/direnv https://github.com/direnv/direnv/releases/download/v2.37.1/direnv.linux-amd64
            echo "1f1b93dd6f38523fde26dfac96151ef9d31a374e3005cd3345fb93555ae0c9b5  bin/direnv" | sha256sum -c -
            chmod +x bin/direnv
          fi
          fetch_pin() { # dir url sha
            if [ ! -d "$1" ]; then
              git init -q "$1" && git -C "$1" remote add origin "$2" \
                && git -C "$1" fetch -q --depth 1 origin "$3" \
                && git -C "$1" checkout -q FETCH_HEAD
            fi
          }
          fetch_pin ohmyzsh https://github.com/ohmyzsh/ohmyzsh.git b37dd49ca5bfe0d99b35607637152cb8cc8b29d7
          fetch_pin powerlevel10k https://github.com/romkatv/powerlevel10k.git 9253fb1c5034410c43a0c681ff8294181c54016c
      - name: run compatibility matrix
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish fzf
          pip install --quiet pexpect
          curl -sL https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh -o /tmp/bash-preexec.sh
          T="$HOME/.cache/bks-compat-tools"
          BKS_BIN="$PWD/backscroll" BKS_TEST_TOOLBIN="$T/bin" \
            BKS_TEST_OMZ="$T/ohmyzsh" BKS_TEST_P10K="$T/powerlevel10k" \
            python3 shell/test_compat_matrix.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -t backscroll:ci .
      - name: smoke test — MCP server responds to initialize + tools/list
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm backscroll:ci > /tmp/out.jsonl
          cat /tmp/out.jsonl
          python3 - <<'PY'
          import json
          lines = [json.loads(l) for l in open("/tmp/out.jsonl") if l.strip()]
          byid = {m.get("id"): m for m in lines if "id" in m}
          assert "serverInfo" in byid[1]["result"], byid[1]
          tools = {t["name"] for t in byid[2]["result"]["tools"]}
          assert tools == {"search_output", "list_commands", "get_output", "diff_output"}, tools
          print("docker MCP smoke test OK:", sorted(tools))
          PY
