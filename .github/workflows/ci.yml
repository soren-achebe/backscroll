name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      - name: shell integration PTY tests (bash, zsh, fish)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          pip install --quiet pexpect
          curl -sL https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh -o /tmp/bash-preexec.sh
          python3 shell/test_bash_integration.py
          python3 shell/test_zsh_fish_integration.py
      - name: cache fish 4.8.1
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/fish-4.8.1
          key: fish-4.8.1-${{ runner.os }}
      - name: E2E test against fish 4.8 native OSC 133 marks (zero-config)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x "$HOME/.cache/fish-4.8.1/fish" ]; then
            mkdir -p "$HOME/.cache/fish-4.8.1"
            curl -sL https://github.com/fish-shell/fish-shell/releases/download/4.8.1/fish-4.8.1-linux-x86_64.tar.xz \
              | tar -xJ -C "$HOME/.cache/fish-4.8.1"
          fi
          BKS_BIN="$PWD/backscroll" BKS_TEST_FISH4="$HOME/.cache/fish-4.8.1/fish" \
            python3 shell/test_fish4_native.py
      - name: cache bash 3.2.57
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/bash-3.2.57
          key: bash-3.2.57-${{ runner.os }}
      - name: PTY tests against bash 3.2.57 (pre-4.0 widget guard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq bison
          sh shell/build-bash32.sh "$HOME/.cache/bash-3.2.57"
          BKS_TEST_BASH="$HOME/.cache/bash-3.2.57/bin/bash" python3 shell/test_bash_integration.py
      - name: PTY tests against macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --quiet --break-system-packages pexpect \
            || python3 -m pip install --quiet pexpect
          BKS_TEST_BASH=/bin/bash python3 shell/test_bash_integration.py
